<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Box</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        #game {
            width: 400px;
            height: 600px;
            margin: 20px auto;
            background: #1f2937;
            border: 4px solid white;
            position: relative;
            overflow: hidden;
        }

        #player {
            width: 70px;
            height: 25px;
            background: #22c55e;
            position: absolute;
            bottom: 20px;
            left: 165px;
            border-radius: 8px;
        }

        #box {
            width: 35px;
            height: 35px;
            background: #ef4444;
            position: absolute;
            top: -40px;
            left: 100px;
            border-radius: 6px;
        }

        #score {
            font-size: 22px;
            margin: 10px;
        }

        #message {
            font-size: 20px;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #3b82f6;
            color: white;
        }

        button:hover {
            background: #2563eb;
        }
    </style>
</head>

<body>

    <h1>🎮 Catch the Box</h1>

    <div id="score">Score: 0 | Missed: 0/5</div>

    <div id="game">
        <div id="box"></div>
        <div id="player"></div>
    </div>

    <div id="message">Use ← and → to move</div>

    <button onclick="restartGame()">Restart Game</button>


    <script>
        const game = document.getElementById("game");
        const player = document.getElementById("player");
        const box = document.getElementById("box");
        const scoreText = document.getElementById("score");
        const message = document.getElementById("message");

        let playerX = 165;
        let boxX = 100;
        let boxY = -40;

        let score = 0;
        let missed = 0;

        let gameOver = false;

        // Player movement
        document.addEventListener("keydown", function(event) {

            if (gameOver) return;

            if (event.key === "ArrowLeft") {
                playerX -= 25;
            }

            if (event.key === "ArrowRight") {
                playerX += 25;
            }

            // Keep player inside the game
            if (playerX < 0) {
                playerX = 0;
            }

            if (playerX > 330) {
                playerX = 330;
            }

            player.style.left = playerX + "px";
        });


        // Create a new falling box
        function newBox() {
            boxX = Math.floor(Math.random() * 365);
            boxY = -40;

            box.style.left = boxX + "px";
            box.style.top = boxY + "px";
        }


        // Main game loop
        function gameLoop() {

            if (gameOver) return;

            boxY += 4;

            box.style.top = boxY + "px";

            // Check if box reaches player
            if (
                boxY > 525 &&
                boxX < playerX + 70 &&
                boxX + 35 > playerX
            ) {

                score++;

                scoreText.innerText =
                    "Score: " + score + " | Missed: " + missed + "/5";

                newBox();
            }


            // Box missed
            if (boxY > 600) {

                missed++;

                scoreText.innerText =
                    "Score: " + score + " | Missed: " + missed + "/5";

                if (missed >= 5) {
                    gameOver = true;

                    message.innerText =
                        "💥 Game Over! Your score: " + score;
                } else {
                    newBox();
                }
            }

            requestAnimationFrame(gameLoop);
        }


        // Restart
        function restartGame() {

            playerX = 165;
            score = 0;
            missed = 0;
            gameOver = false;

            player.style.left = playerX + "px";

            scoreText.innerText =
                "Score: 0 | Missed: 0/5";

            message.innerText =
                "Use ← and → to move";

            newBox();

            gameLoop();
        }


        // Start game
        newBox();
        gameLoop();
    </script>

</body>
</html>
